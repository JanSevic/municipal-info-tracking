name: Obecní radar – sběr a web

on:
  schedule:
    - cron: "17 6 * * *"        # jednou denně v 6:17 UTC (7:17 SEČ / 8:17 SELČ) – po 7:00, aby odešly i denní souhrny
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Zkušební běh: nic neukládat, neposílat e-maily, nenasazovat web"
        type: boolean
        default: false
  push:
    branches-ignore: [data]
    paths: ["web/**", "config/presets.json", "config/obce.json"]   # změna webu -> nové nasazení

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      deploy: ${{ steps.flags.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4

      - id: flags
        run: |
          DRY="${{ inputs.dry_run || 'false' }}"
          echo "dry=$DRY" >> "$GITHUB_OUTPUT"
          if [ "$DRY" != "true" ] && [ "${{ github.ref_name }}" = "${{ github.event.repository.default_branch }}" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Načíst data (větev data)
        run: |
          REMOTE="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          if git ls-remote --exit-code --heads origin data >/dev/null; then
            git clone -q --depth 1 --branch data "$REMOTE" data
          else
            mkdir data && git -C data init -q -b data && git -C data remote add origin "$REMOTE"
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Sběr
        if: github.event_name != 'push'
        env:
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          SUBSCRIPTIONS_PRIVATE_KEY: ${{ secrets.SUBSCRIPTIONS_PRIVATE_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          SMTP_SECURITY: ${{ secrets.SMTP_SECURITY }}
        run: |
          if [ "${{ steps.flags.outputs.dry }}" = "true" ]; then
            python -m collector.main --data data --no-email
          else
            python -m collector.main --data data
          fi

      - name: Uložit data
        if: steps.flags.outputs.deploy == 'true' && github.event_name != 'push'
        run: |
          cd data
          git config user.name "obecni-radar[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "Beze změn"; exit 0; fi
          git commit -q -m "Data $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q origin HEAD:data

      - name: Sestavit web
        env:
          SITE_BRANCH: ${{ github.event.repository.default_branch }}
        run: tools/build_site.sh data _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: collect
    if: needs.collect.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
