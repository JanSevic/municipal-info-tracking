name: Connectivity test
on:
  push:
    paths: ['.github/workflows/connectivity.yml']
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Probe sources
        run: |
          curl -s https://ipinfo.io/json || true
          for h in stredoceskykraj.cz www.stredoceskykraj.cz www.kr-stredocesky.cz kr-stredocesky.cz www.rsd.cz rsd.cz www.spravazeleznic.cz; do
            echo "DNS $h: $(getent ahosts $h | head -2 | tr '\n' ' ')"
          done
          for u in \
            "http://www.stredoceskykraj.cz/" \
            "https://www.kr-stredocesky.cz/" \
            "http://www.kr-stredocesky.cz/" \
            "https://www.rsd.cz/uredni-deska" \
            "http://www.rsd.cz/" \
            "https://rsd.cz/" \
            "https://www.spravazeleznic.cz/o-nas/uredni-deska" ; do
            echo "$u -> $(curl -4 -s -k -L -o /dev/null -w '%{http_code} %{size_download} %{url_effective}' -m 30 "$u" || echo FAIL)"
          done
